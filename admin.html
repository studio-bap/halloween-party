<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>운영자 페이지</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: black;
            overflow: hidden;
        }

        .container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .scare-image {
            width: 600px;
            opacity: 0;
            transform: scale(0.1);
        }

        .message {
            margin-top: 20px;
            color: red;
            font-size: 40px;
            font-weight: bold;
            opacity: 0;
            transform: scale(0.1);
        }

        .show .scare-image {
            animation: pop 0.35s forwards;
        }

        .show .message {
            animation: pop 0.35s 0.1s forwards;
        }

        @keyframes pop {
            0% {
                opacity: 0;
                transform: scale(0.1);
            }

            60% {
                opacity: 1;
                transform: scale(1.15);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>

<body>

    <div class="container" id="container">
        <img class="scare-image" src="ahhhhey.png">
        <div class="message">아직 다 안 만들었어 크아앙(귀찮아)</div>
    </div>

    <script>
        setTimeout(() => {
            document.getElementById("container").classList.add("show");
        }, 1500);
    </script>

</body>
</html>
