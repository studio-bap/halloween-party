<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>운영자 패널</title>
</head>
<body>

  <a class="admin-link" href="#" onclick="goAdmin(event)">운영자 로그인</a>

  <script>
    function goAdmin(e) {
      e.preventDefault();
      const password = prompt("운영자 암호를 입력하세요:");
      
      if (password === "1031") {
        alert("하하맞았어")
      } else if (password !== null) {
        alert("암호가 올바르지 않습니다!");
      }
    }
  </script>
</body>
</html>
