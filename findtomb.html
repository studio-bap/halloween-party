<h2 id="result">과연 어떤 결과가 나올까요?</h2>

<script>
    function openGrave() {
        const results = [
            "🍫초콜릿을 받아 가세요!",
            "💀 꽝!",
            "👻 귀신 등장!"
        ];

        const random = Math.floor(Math.random() * 3);

        if (random === 2) {
            window.location.href = "punishment.html";
        } else {
            document.getElementById("result").textContent = results[random];
        }
    }
</script>
